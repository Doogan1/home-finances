# Local development stack: Next.js (hot reload) + PostgreSQL 17.
#
# First run:   npm run setup:env   &&   docker compose up --build
# Stop:        docker compose down            (keeps your data)
# DANGER:      docker compose down -v         (deletes the database volume)

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run "npm run setup:env" to create .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run "npm run setup:env" to create .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Run "npm run setup:env" to create .env first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` on purpose: PostgreSQL is reachable only from other services
    # on this Compose network. See compose.debug.yaml for an opt-in override.

  app:
    build:
      context: .
      target: dev
    env_file: .env
    # Webpack, not the default Turbopack: only webpack honors WATCHPACK_POLLING,
    # which Docker Desktop on Windows needs for hot reload to see edits. For a
    # faster loop, run `npm run dev` on the host instead (see README).
    command: ["npx", "next", "dev", "--webpack", "--hostname", "0.0.0.0", "--port", "3000"]
    environment:
      # Bind mounts from Windows don't deliver file-change events into Linux
      # containers, so poll for changes to keep hot reload working.
      WATCHPACK_POLLING: "true"
    ports:
      # Host side is loopback only; the app listens on 0.0.0.0 inside the container.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - app-next:/app/.next
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  db-data:
  app-node-modules:
  app-next:
